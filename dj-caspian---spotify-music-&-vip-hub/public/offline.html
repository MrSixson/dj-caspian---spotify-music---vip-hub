<!doctype html>
<html lang="fa-IR" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080e">
  <title>آفلاین | DJ Caspian</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#05080e;color:#f5f2e9;font-family:Tahoma,Arial,sans-serif;text-align:center}
    main{max-width:420px;padding:36px;border:1px solid #b9954b55;border-radius:24px;background:#0c1728;box-shadow:0 24px 80px #0008}
    .mark{width:76px;height:76px;margin:0 auto 22px;border:2px solid #d8b66a;border-radius:22px;display:grid;place-items:center;color:#e1c27a;font-size:32px;font-weight:bold}
    h1{color:#e1c27a;font-size:24px}p{line-height:2;color:#c5ccd6}button{border:0;border-radius:12px;padding:13px 22px;background:#d8b66a;color:#101827;font-weight:bold;font-size:15px}
  </style>
</head>
<body>
  <main>
    <div class="mark">C</div>
    <h1>اتصال اینترنت در دسترس نیست</h1>
    <p>بعضی از بخش‌های DJ Caspian برای دریافت اطلاعات و پخش موسیقی به اینترنت نیاز دارند. پس از اتصال دوباره، صفحه را بارگذاری کن.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </main>
</body>
</html>
