<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b09">
<meta name="robots" content="noindex,nofollow">
<title>DJ Caspian | به‌زودی برمی‌گردیم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b09;color:#f4f7f4;font-family:Vazirmatn,sans-serif}
main{min-height:100svh;display:grid;place-items:center;position:relative;isolation:isolate;overflow:hidden;padding:24px;background:radial-gradient(ellipse at 50% 10%,rgba(29,215,96,.15),transparent 38%),radial-gradient(ellipse at 90% 90%,rgba(201,169,99,.09),transparent 35%),#080b09}
main:before,main:after{content:"";position:absolute;z-index:-1;width:min(86vw,560px);aspect-ratio:1;border:1px solid rgba(29,215,96,.12);border-radius:50%;animation:spin 32s linear infinite}
main:after{width:min(105vw,720px);border-color:rgba(210,184,125,.08);animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}
.card{width:min(100%,650px);padding:clamp(28px,6vw,56px);text-align:center;border:1px solid #ffffff17;border-radius:30px;background:linear-gradient(145deg,#171d19f2,#0d100ff5);box-shadow:0 30px 100px #0009,inset 0 1px #ffffff0b;backdrop-filter:blur(18px)}
.logo{width:68px;height:68px;margin:0 auto 24px;display:grid;place-items:center;border:1px solid #1ed76055;border-radius:22px;background:#1ed76012;color:#1ed760;box-shadow:0 0 45px #1ed76012}.logo svg{width:31px;height:31px}
.eyebrow{font:800 11px 'Plus Jakarta Sans',sans-serif;letter-spacing:.27em;color:#1ed760;direction:ltr}
h1{font-size:clamp(32px,6.5vw,50px);line-height:1.45;margin:16px 0 12px;font-weight:900;letter-spacing:-.04em}h1 span{color:#1ed760}
.copy{max-width:455px;margin:0 auto;color:#a8b1aa;font-size:14px;line-height:2.1}
.rule{height:1px;margin:30px 0 24px;background:linear-gradient(90deg,transparent,#ffffff20,transparent)}
.label{font-size:12px;color:#b8c0ba;margin-bottom:16px}
.timer{display:flex;justify-content:center;gap:clamp(8px,3vw,17px);direction:ltr}
.unit{min-width:clamp(65px,17vw,92px);padding:15px 9px 12px;border:1px solid #ffffff12;border-radius:16px;background:#ffffff06}
.value{display:block;font:800 clamp(28px,6vw,40px)/1.1 'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.name{display:block;margin-top:9px;color:#7f8982;font-size:10px}
.status{display:inline-flex;align-items:center;gap:9px;margin-top:26px;padding:9px 14px;border:1px solid #1ed7602b;border-radius:999px;background:#1ed7600d;color:#bce9ca;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:#1ed760;box-shadow:0 0 12px #1ed760;animation:pulse 1.6s ease-in-out infinite}
.footer{margin-top:26px;font:600 10px 'Plus Jakarta Sans',sans-serif;letter-spacing:.16em;color:#5e6861;direction:ltr}
@media(max-width:420px){.card{border-radius:24px}.copy{font-size:13px}.unit{padding:13px 6px 10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<main>
<section class="card" aria-label="صفحه آماده‌سازی DJ Caspian">
<div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 13.5V10a8 8 0 0 1 16 0v3.5M4 12h3v6H5a2 2 0 0 1-2-2v-2a2 2 0 0 1 1-2Zm16 0h-3v6h2a2 2 0 0 0 2-2v-2a2 2 0 0 0-1-2ZM17 18a5 5 0 0 1-5 3h-1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="eyebrow">DJ CASPIAN · OFFICIAL</div>
<h1>یه اتفاق <span>خفن</span><br>در راهه.</h1>
<p class="copy">داریم آخرین جزئیات تجربه‌ی جدید DJ Caspian رو آماده می‌کنیم. سایت موقتاً در حال به‌روزرسانیه و به‌زودی با حال‌وهوایی تازه برمی‌گرده.</p>
<div class="rule"></div>
<div class="label">زمان باقی‌مانده تا بازگشایی سایت</div>
<div class="timer" role="timer" aria-label="زمان باقی‌مانده تا بازگشایی">
<div class="unit"><span class="value" id="hours">12</span><span class="name">ساعت</span></div>
<div class="unit"><span class="value" id="minutes">00</span><span class="name">دقیقه</span></div>
<div class="unit"><span class="value" id="seconds">00</span><span class="name">ثانیه</span></div>
</div>
<div class="status"><span class="dot"></span><span id="status">در حال آماده‌سازی نسخه‌ی جدید</span></div>
<div class="footer">MUSIC · ENERGY · CASPIAN</div>
</section>
</main>
<script>
(()=>{const deadline=Date.parse('2026-11-01T01:06:54Z');const h=document.getElementById('hours'),m=document.getElementById('minutes'),s=document.getElementById('seconds'),status=document.getElementById('status');let checking=false;async function checkRestored(){try{const url=new URL(window.location.href);url.searchParams.set('caspian_restore_check',String(Date.now()));const response=await fetch(url.toString(),{cache:'no-store'});if(!response.ok)return;const html=await response.text();if(html.includes('id="root"')&&!html.includes('id="hours"')){const target=new URL(window.location.pathname,window.location.origin);target.searchParams.set('restored',String(Date.now()));window.location.replace(target.href)}}catch(e){}}function tick(){const left=Math.max(0,deadline-Date.now());h.textContent=String(Math.floor(left/3600000)).padStart(2,'0');m.textContent=String(Math.floor(left%3600000/60000)).padStart(2,'0');s.textContent=String(Math.floor(left%60000/1000)).padStart(2,'0');if(left===0){status.textContent='پایان زمان آماده‌سازی؛ در حال بازگشت نسخه اصلی';if(!checking){checking=true;checkRestored();setInterval(checkRestored,15000)}}}tick();setInterval(tick,1000)})();</script>
</body>
</html>
