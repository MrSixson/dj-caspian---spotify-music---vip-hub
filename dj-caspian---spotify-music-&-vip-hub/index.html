<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#080d12" />
  <title>DJ Caspian | در حال بازسازی</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#153047 0%,#0b121b 48%,#06090e 100%);color:#edf4f8;font-family:Tahoma,Arial,sans-serif}
    main{width:min(100%,620px);padding:52px 30px;text-align:center;border:1px solid #263b4b;border-radius:24px;background:rgba(9,17,25,.88);box-shadow:0 24px 90px #0009}
    .mark{width:64px;height:64px;margin:0 auto 24px;display:grid;place-items:center;border:1px solid #c9a45a;border-radius:18px;color:#d9b66d;font-size:25px;font-weight:800;letter-spacing:-2px}
    .eyebrow{color:#d9b66d;font-size:12px;letter-spacing:3px;font-weight:700}
    h1{margin:16px 0;font-size:clamp(27px,6vw,42px)}
    p{margin:0;color:#aebdca;font-size:15px;line-height:2.2}
    .line{width:54px;height:2px;margin:28px auto;background:#c9a45a}
    small{color:#718394;font-size:11px;letter-spacing:2px}
  </style>
</head>
<body>
  <main>
    <div class="mark">DC</div>
    <div class="eyebrow">DJ CASPIAN</div>
    <h1>در حال بازسازی هستیم</h1>
    <p>وب‌سایت DJ Caspian موقتاً برای بازبینی فنی و بازسازی زیرساخت متوقف شده است.<br>به‌زودی با تجربه‌ای بهتر بازمی‌گردیم.</p>
    <div class="line"></div>
    <small>MAINTENANCE MODE</small>
  </main>
</body>
</html>
