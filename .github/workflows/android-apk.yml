name: Build DJ Caspian Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "dj-caspian---spotify-music-&-vip-hub/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dj-caspian-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build and publish DJ Caspian Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dj-caspian---spotify-music-&-vip-hub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            SDKMANAGER_PATH=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
            test -n "$SDKMANAGER_PATH"
            echo "$(dirname "$SDKMANAGER_PATH")" >> "$GITHUB_PATH"
          fi

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install web and Capacitor dependencies
        run: npm install --legacy-peer-deps

      - name: Download official Caspian logo for Android launcher icon
        run: |
          mkdir -p resources
          curl --fail --location --silent --show-error \
            "https://irkdzjizhwxbmnnfyqsx.supabase.co/storage/v1/object/public/brand-assets/caspian-official-logo.png" \
            --output resources/icon.png
          test -s resources/icon.png

      - name: Build web assets for Android
        env:
          VITE_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: npm run build:android

      - name: Create Android native project
        run: npx cap add android

      - name: Configure Firebase for Android
        run: |
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          text = root.read_text()
          dependency_line = "classpath 'com.google.gms:google-services:4.4.2'"
          if dependency_line not in text:
              anchor = "dependencies {"
              if anchor not in text:
                  raise SystemExit("Could not find Android buildscript dependencies block")
              text = text.replace(anchor, anchor + "\\n        " + dependency_line, 1)
              root.write_text(text)
          app_text = app.read_text()
          plugin = "apply plugin: 'com.google.gms.google-services'"
          if plugin not in app_text:
              app.write_text(app_text.rstrip() + "\\n\\n" + plugin + "\\n")
          PY
          test -s android/app/google-services.json
          grep -q "com.google.gms.google-services" android/app/build.gradle

      - name: Generate native Android icon assets from official Caspian logo
        run: |
          test -s resources/icon.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor "#080d16" --iconBackgroundColorDark "#080d16"
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Set the installed application name
        run: |
          test "$(node -p "require('./capacitor.config.json').appName")" = "DJ Caspian"
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          test -f "$STRINGS_FILE"
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">DJ Caspian</string>#' "$STRINGS_FILE"
          grep -q '<string name="app_name">DJ Caspian</string>' "$STRINGS_FILE"

      - name: Sync native project
        run: npx cap sync android

      - name: Set Android version from the workflow run
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          gradle = Path('android/app/build.gradle')
          content = gradle.read_text()
          code = os.environ['APP_VERSION_CODE']
          name = os.environ['APP_VERSION_NAME']
          content, code_count = re.subn(r'(?m)^(\s*versionCode\s+)\d+(\s*)$', rf'\g<1>{code}\g<2>', content, count=1)
          content, name_count = re.subn(r'(?m)^(\s*versionName\s+)[\"\'][^\"\']+[\"\'](\s*)$', rf'\g<1>"{name}"\g<2>', content, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not set Android versionCode/versionName in app/build.gradle')
          gradle.write_text(content)
          print(f'Android version: {name} (code {code})')
          PY

      - name: Build installable Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name and verify APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/DJ-Caspian.apk
          test -s android/app/build/outputs/apk/debug/DJ-Caspian.apk
          ls -lh android/app/build/outputs/apk/debug/DJ-Caspian.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Caspian-Android-APK
          path: dj-caspian---spotify-music-&-vip-hub/android/app/build/outputs/apk/debug/DJ-Caspian.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish public APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: DJ Caspian Android v1.0.${{ github.run_number }}
          body: |
            نسخه قابل نصب اپلیکیشن مستقل DJ Caspian برای اندروید.

            نسخه: 1.0.${{ github.run_number }}
            کد نسخه اندروید: ${{ github.run_number }}

            نام نمایشی برنامه پس از نصب: DJ Caspian
            نام فایل دانلود: DJ-Caspian.apk

            فایل APK را دانلود و روی گوشی اندرویدی نصب کنید. در صورت نمایش هشدار، نصب از این منبع را برای مرورگر/مدیریت فایل مجاز کنید.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dj-caspian---spotify-music-&-vip-hub/android/app/build/outputs/apk/debug/DJ-Caspian.apk
