name: Restore DJ Caspian after maintenance

on:
  schedule:
    - cron: '*/5 19-23 3 11 *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  restore-original-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dj-caspian---spotify-music-&-vip-hub
    environment:
      name: github-pages
    steps:
      - name: Check out full history
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Restore the original app entry from the verified pre-maintenance commit
        shell: bash
        run: |
          set -euo pipefail
          restore_after="$(date -u -d '2026-11-03T19:02:44Z' +%s)"
          now="$(date -u +%s)"
          if (( now < restore_after )); then
            echo "The original site is scheduled to restore after 2026-11-03 19:02:44 UTC. Refusing to deploy it early."
            exit 1
          fi
          git cat-file -e 'fa174bc3551254ed42fbc79b897552a01cd229fb:dj-caspian---spotify-music-&-vip-hub/index.html'
          git show 'fa174bc3551254ed42fbc79b897552a01cd229fb:dj-caspian---spotify-music-&-vip-hub/index.html' > index.html

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build the original site
        run: npm run build

      - name: Upload original Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dj-caspian---spotify-music-&-vip-hub/dist

      - name: Deploy original site
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Persist restored source and remove this one-time workflow
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'dj-caspian---spotify-music-&-vip-hub/index.html'
          git rm -- '.github/workflows/restore-dj-caspian-maintenance.yml'
          git commit -m 'Restore original DJ Caspian site after maintenance'
          git push origin main
