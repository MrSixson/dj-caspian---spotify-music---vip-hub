name: Restore DJ Caspian after maintenance

on:
  schedule:
    - cron: '7 1 1 11 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dj-caspian-maintenance-restore
  cancel-in-progress: false

jobs:
  restore-original-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Restore the original source once
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(date -u +%F)" != "2026-11-01" ]]; then
            echo "This one-time restoration is only valid on 2026-11-01 UTC."
            exit 0
          fi
          git show fa174bc3551254ed42fbc79b897552a01cd229fb:dj-caspian---spotify-music-&-vip-hub/index.html > 'dj-caspian---spotify-music-&-vip-hub/index.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'dj-caspian---spotify-music-&-vip-hub/index.html'
          git rm -- '.github/workflows/restore-dj-caspian-maintenance.yml'
          git commit -m 'Restore original DJ Caspian site after maintenance'
          git push origin main
